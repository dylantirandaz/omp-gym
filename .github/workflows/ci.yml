name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync
      - run: uv run ruff check src/omp_gym tests holdout-tasks
      - run: uv run python -m unittest discover -s tests

  environment-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv build --wheel environments/omp-coding --out-dir dist/environment
      - name: Verify public environment wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist/environment").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              tasks = {
                  name.split("/")[-2]
                  for name in names
                  if name.startswith("omp_coding/tasks/")
                  and name.endswith("/task.toml")
              }
              metadata_name = next(
                  name
                  for name in names
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = archive.read(metadata_name).decode()
          assert len(tasks) == 18, sorted(tasks)
          assert "omp_coding/__init__.py" in names
          assert "README.md" in names
          assert "pyproject.toml" in names
          assert "Requires-Python: <3.14,>=3.11" in metadata
          assert "@main" not in metadata
          assert "@0a4d872f021022310a08ec213a25f4efb4a0244a" in metadata
          PY
