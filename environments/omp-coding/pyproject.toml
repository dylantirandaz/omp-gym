[project]
name = "omp-coding"
version = "0.1.0"
description = "Agentic coding tasks driven through the omp harness: real tool-use episodes scored by tests."
tags = ["coding", "agent", "tools", "omp"]
dependencies = [
    "verifiers",
    "omp-gym @ git+https://github.com/dylantirandaz/omp-gym.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["omp_coding"]
