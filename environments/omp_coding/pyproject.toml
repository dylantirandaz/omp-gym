[project]
name = "omp-coding"
version = "1.2.0"
description = "Sealed coding tasks driven through OMP on Prime Verifiers v1."
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "MIT"
tags = ["coding", "agent", "tools", "omp"]
dependencies = [
    "aiohttp>=3.11,<4",
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@0a4d872f021022310a08ec213a25f4efb4a0244a",
]

[project.optional-dependencies]
metal = [
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
omp-coding-train = "omp_coding.training:main"
omp-coding-protocol = "omp_coding.protocol:main"
omp-coding-metrics = "omp_coding.metrics:main"
omp-coding-evaluate = "omp_coding.evaluation:main"
omp-coding-mint = "omp_coding.mint:main"
omp-coding-bench = "omp_coding.bench:main"
omp-coding-eval = "omp_coding.prime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["omp_coding/**", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["omp_coding"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "README.md"
"pyproject.toml" = "pyproject.toml"
