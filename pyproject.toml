[project]
name = "omp-gym"
version = "0.1.0"
description = "Training environment for coding models, built on the omp tool surface."
requires-python = ">=3.11"
dependencies = [
    "mlx-lm>=0.24",
]

[project.scripts]
omp-gym = "omp_gym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omp_gym"]
