[project]
name = "omp-gym"
version = "1.0.0"
description = "Workspace for the OMP coding environment on Prime Verifiers v1."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["environments/omp_coding"]

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "ruff>=0.15,<0.16",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"environments/omp_coding/tests/**" = ["S101"]
"environments/omp_coding/omp_coding/_vendor/**" = ["ALL"]
"environments/omp_coding/omp_coding/tasks/**" = ["ALL"]
